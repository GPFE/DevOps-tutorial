name: ci
on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'
jobs:
  lint-html:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v4

      - name: Install dependencies
        run: npm i -g htmlhint

      - name: Run html linter
        run: npx htmlhint index.html
  update_changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update changelog via Codex
        run: |
          npm install -g @openai/codex
          export AZURE_OPENAI_API_KEY="${{ secrets.AZURE_OPENAI_API_KEY }}" 
          codex -p azure exec --sandbox workspace-write "update CHANGELOG for next release"
